steps:
  # BACKEND DEPLOYMENT
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$REPO_NAME/be:$COMMIT_SHA'
      - '-f'
      - 'apps/be/Dockerfile'
      - 'apps/be'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$REPO_NAME/be:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_BE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/$REPO_NAME/be:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # FRONTEND DEPLOYMENT
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$REPO_NAME/fe:$COMMIT_SHA'
      - '-f'
      - 'apps/fe/Dockerfile'
      - 'apps/fe'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$REPO_NAME/fe:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME_FE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/$REPO_NAME/fe:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/$REPO_NAME/be:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/$REPO_NAME/fe:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE_NAME_BE: tool-marketing-be
  _SERVICE_NAME_FE: tool-marketing-fe
